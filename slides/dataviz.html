<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Visualization</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap');

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      background-color: #0a0a0a;
      overflow: hidden;
    }

    embed {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .back-link {
      position: fixed;
      top: 1em;
      left: 1.2em;
      z-index: 100;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 0.75rem;
      font-weight: 400;
      color: #a3a3a3;
      text-decoration: none;
      letter-spacing: 0.02em;
      transition: color 0.2s ease, background 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.4em;
      background: rgba(10, 10, 10, 0.8);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 0.45em 0.8em;
      border-radius: 8px;
      border: 1px solid #1f1f1f;
    }

    .back-link:hover {
      color: #e5e5e5;
      border-color: #333;
    }

    .back-link svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>
  <a href="index.html" class="back-link">
    <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    slides
  </a>

  <iframe src="https://docs.google.com/gview?url=https://raw.githubusercontent.com/pradervonsky/dataviz_tableau/main/slides/DataViz_with_Tableau_v2.pdf&embedded=true" style="width:100%;height:100%;border:none"></iframe>
</body>
</html>
