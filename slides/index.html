<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>prd/slides</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #0a0a0a;
      color: #e5e5e5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .container {
      max-width: 640px;
      width: 100%;
    }

    header {
      margin-bottom: 3rem;
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: -0.025em;
      color: #fafafa;
    }

    header p {
      margin-top: 0.5rem;
      font-size: 0.875rem;
      font-weight: 300;
      color: #737373;
      letter-spacing: 0.025em;
    }

    .cards {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .card {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      padding: 1.25rem 1.5rem;
      background: #141414;
      border: 1px solid #1f1f1f;
      border-radius: 12px;
      text-decoration: none;
      color: inherit;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
    }

    .card:hover {
      background: #1a1a1a;
      border-color: #333;
      transform: translateY(-2px);
    }

    .card-icon {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: #1c1c1c;
      border: 1px solid #262626;
    }

    .card-icon svg {
      width: 20px;
      height: 20px;
      stroke: #a3a3a3;
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .card:hover .card-icon {
      background: #262626;
      border-color: #404040;
    }

    .card:hover .card-icon svg {
      stroke: #e5e5e5;
    }

    .card-body {
      flex: 1;
      min-width: 0;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 500;
      color: #fafafa;
      letter-spacing: -0.01em;
    }

    .card-desc {
      margin-top: 0.25rem;
      font-size: 0.8rem;
      font-weight: 300;
      color: #636363;
    }

    .card-arrow {
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      stroke: #404040;
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.2s ease, transform 0.2s ease;
    }

    .card:hover .card-arrow {
      stroke: #737373;
      transform: translateX(3px);
    }

    footer {
      margin-top: 4rem;
      text-align: center;
      font-size: 0.75rem;
      color: #404040;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>pradervonsky/slides</h1>
      <p>A curated collection of my own made slides related to BI and DataViz</p>
    </header>

    <div class="cards">
      <a href="bi.html" class="card">
        <div class="card-icon">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="3" width="7" height="9" rx="1" />
            <rect x="14" y="3" width="7" height="5" rx="1" />
            <rect x="14" y="12" width="7" height="9" rx="1" />
            <rect x="3" y="16" width="7" height="5" rx="1" />
          </svg>
        </div>
        <div class="card-body">
          <div class="card-title">Business Intelligence</div>
          <div class="card-desc">BI roles on bridging the gap between data science & business applications</div>
        </div>
        <svg class="card-arrow" viewBox="0 0 24 24">
          <path d="M5 12h14M12 5l7 7-7 7" />
        </svg>
      </a>

      <a href="dataviz.html" class="card">
        <div class="card-icon">
          <svg viewBox="0 0 24 24">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
          </svg>
        </div>
        <div class="card-body">
          <div class="card-title">Data Visualization with Tableau</div>
          <div class="card-desc">Visual storytelling and design principles</div>
        </div>
        <svg class="card-arrow" viewBox="0 0 24 24">
          <path d="M5 12h14M12 5l7 7-7 7" />
        </svg>
      </a>
    </div>

    <footer><a href="https://github.com/pradervonsky" target="_blank" style="color:inherit;text-decoration:none;transition:color .2s">M. Pradana Aditya</a> &middot; 2025</footer>
  </div>
</body>
</html>
